name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run integration test
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\tests\Test-RobCleaner.ps1

      - name: Build release archive
        shell: powershell
        run: |
          $tag = $env:GITHUB_REF_NAME
          $stage = Join-Path $env:RUNNER_TEMP "RobCleaner-$tag"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath .\RobCleaner.ps1, .\LICENSE -Destination $stage
          Get-ChildItem -LiteralPath . -File -Filter *.md | Copy-Item -Destination $stage
          $zip = Join-Path $env:RUNNER_TEMP "RobCleaner-$tag.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = Join-Path $env:RUNNER_TEMP "RobCleaner-$tag.zip.sha256"
          "$hash  RobCleaner-$tag.zip" | Out-File -LiteralPath $checksum -Encoding ascii
          "ARCHIVE=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHECKSUM=$checksum" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME $env:ARCHIVE $env:CHECKSUM --title "RobCleaner $env:GITHUB_REF_NAME" --generate-notes
